<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molekulová Struktura</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f1117;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #7dd3fc;
            margin-bottom: 0.3rem;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .card {
            background: #1a1d27;
            border: 1px solid #2d3148;
            border-radius: 16px;
            padding: 1.5rem;
            width: 100%;
            max-width: 680px;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6b7280;
            margin-bottom: 1rem;
        }

        .atoms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.75rem;
        }

        .atom-control {
            background: #12141e;
            border: 1px solid #2d3148;
            border-radius: 10px;
            padding: 0.7rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            transition: border-color 0.2s;
        }

        .atom-control:hover {
            border-color: #4f6ef7;
        }

        .atom-symbol {
            font-size: 1.3rem;
            font-weight: 700;
            color: #e0e0e0;
        }

        .atom-name {
            font-size: 0.65rem;
            color: #6b7280;
        }

        .atom-counter {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-count {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            border: 1px solid #2d3148;
            background: #1a1d27;
            color: #7dd3fc;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            transition: background 0.15s;
        }

        .btn-count:hover {
            background: #2d3148;
        }

        .count-input {
            width: 36px;
            text-align: center;
            background: transparent;
            border: none;
            color: #e0e0e0;
            font-size: 1rem;
            font-weight: 600;
        }

        .count-input::-webkit-inner-spin-button,
        .count-input::-webkit-outer-spin-button { -webkit-appearance: none; }

        .formula-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #2d3148;
            flex-wrap: wrap;
        }

        .formula-display {
            font-size: 1.4rem;
            font-weight: 700;
            color: #7dd3fc;
            font-family: 'Courier New', monospace;
            flex: 1;
            min-width: 100px;
        }

        .formula-display sub {
            font-size: 0.7em;
            vertical-align: sub;
        }

        .btn-search {
            background: linear-gradient(135deg, #4f6ef7, #7c3aed);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0.7rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn-search:hover { opacity: 0.9; }
        .btn-search:active { transform: scale(0.97); }
        .btn-search:disabled { opacity: 0.5; cursor: default; }

        .btn-reset {
            background: transparent;
            color: #6b7280;
            border: 1px solid #2d3148;
            border-radius: 10px;
            padding: 0.7rem 1rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .btn-reset:hover { color: #e0e0e0; }

        #results {
            width: 100%;
            max-width: 680px;
        }

        .status {
            text-align: center;
            color: #6b7280;
            padding: 1rem;
            font-size: 0.9rem;
        }

        .status.loading { color: #7dd3fc; }
        .status.error { color: #f87171; }

        .result-card {
            background: #1a1d27;
            border: 1px solid #2d3148;
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .result-image-wrap {
            background: #12141e;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1;
            overflow: hidden;
        }

        .result-image-wrap canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .result-info {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            text-align: center;
        }

        .result-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #e0e0e0;
        }

        .result-iupac {
            font-size: 0.8rem;
            color: #6b7280;
            font-style: italic;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            justify-content: center;
        }

        .badge {
            display: inline-block;
            background: #12141e;
            border: 1px solid #2d3148;
            border-radius: 6px;
            padding: 0.25rem 0.6rem;
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .badge span { color: #7dd3fc; font-weight: 600; }

        .result-formula {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            color: #a78bfa;
            font-weight: 600;
        }

        .result-formula sub { font-size: 0.7em; vertical-align: sub; }

        .link-pubchem {
            font-size: 0.8rem;
            color: #4f6ef7;
            text-decoration: none;
        }

        .link-pubchem:hover { text-decoration: underline; }
    </style>
</head>
<body>

<h1>Molekulová Struktura</h1>
<p class="subtitle">Zadej počty atomů a zobraz strukturní vzorec</p>

<div class="card">
    <div class="card-title">Počty atomů</div>
    <div class="atoms-grid" id="atomsGrid"></div>

    <div class="formula-row">
        <div class="formula-display" id="formulaDisplay">—</div>
        <button class="btn-reset" onclick="resetAll()">Vymazat</button>
        <button class="btn-search" id="searchBtn" onclick="search()" disabled>Hledat strukturu</button>
    </div>
</div>

<div id="results"></div>

<script>
const ATOMS = [
    { symbol: 'H',  name: 'Vodík',     color: '#e0e0e0', order: 2 },
    { symbol: 'C',  name: 'Uhlík',     color: '#94a3b8', order: 1 },
    { symbol: 'N',  name: 'Dusík',     color: '#60a5fa', order: 3 },
    { symbol: 'O',  name: 'Kyslík',    color: '#f87171', order: 4 },
    { symbol: 'S',  name: 'Síra',      color: '#facc15', order: 5 },
    { symbol: 'P',  name: 'Fosfor',    color: '#fb923c', order: 6 },
    { symbol: 'F',  name: 'Fluor',     color: '#34d399', order: 7 },
    { symbol: 'Cl', name: 'Chlor',     color: '#4ade80', order: 8 },
    { symbol: 'Br', name: 'Brom',      color: '#a78bfa', order: 9 },
    { symbol: 'I',  name: 'Jód',       color: '#c084fc', order: 10 },
    { symbol: 'Na', name: 'Sodík',     color: '#fbbf24', order: 11 },
    { symbol: 'K',  name: 'Draslík',   color: '#f472b6', order: 12 },
    { symbol: 'Ca', name: 'Vápník',    color: '#e2e8f0', order: 13 },
    { symbol: 'Fe', name: 'Železo',    color: '#fb923c', order: 14 },
    { symbol: 'Mg', name: 'Hořčík',    color: '#86efac', order: 15 },
    { symbol: 'Zn', name: 'Zinek',     color: '#93c5fd', order: 16 },
];

const counts = {};
ATOMS.forEach(a => counts[a.symbol] = 0);

let allCids = [];

function buildGrid() {
    const grid = document.getElementById('atomsGrid');
    grid.innerHTML = '';
    ATOMS.forEach(atom => {
        const div = document.createElement('div');
        div.className = 'atom-control';
        div.innerHTML = `
            <div class="atom-symbol" style="color:${atom.color}">${atom.symbol}</div>
            <div class="atom-name">${atom.name}</div>
            <div class="atom-counter">
                <button class="btn-count" onclick="change('${atom.symbol}',-1)">−</button>
                <input class="count-input" type="number" min="0" max="99"
                    id="cnt-${atom.symbol}" value="0"
                    oninput="onInput('${atom.symbol}', this.value)">
                <button class="btn-count" onclick="change('${atom.symbol}',1)">+</button>
            </div>
        `;
        grid.appendChild(div);
    });
}

function change(symbol, delta) {
    counts[symbol] = Math.max(0, (counts[symbol] || 0) + delta);
    document.getElementById(`cnt-${symbol}`).value = counts[symbol];
    updateFormula();
}

function onInput(symbol, val) {
    counts[symbol] = Math.max(0, parseInt(val) || 0);
    updateFormula();
}

function hillFormula() {
    // Hill order: C first, H second, then rest alphabetically
    const order = ['C', 'H', ...ATOMS.map(a => a.symbol).filter(s => s !== 'C' && s !== 'H').sort()];
    let parts = [];
    order.forEach(s => {
        if (counts[s] > 0) parts.push({ s, n: counts[s] });
    });
    return parts;
}

function formulaString(parts) {
    return parts.map(p => p.s + (p.n > 1 ? p.n : '')).join('');
}

function formulaHTML(parts) {
    return parts.map(p => p.s + (p.n > 1 ? `<sub>${p.n}</sub>` : '')).join('');
}

function updateFormula() {
    const parts = hillFormula();
    const display = document.getElementById('formulaDisplay');
    const btn = document.getElementById('searchBtn');
    if (parts.length === 0) {
        display.innerHTML = '—';
        btn.disabled = true;
    } else {
        display.innerHTML = formulaHTML(parts);
        btn.disabled = false;
    }
}

function resetAll() {
    ATOMS.forEach(a => {
        counts[a.symbol] = 0;
        const el = document.getElementById(`cnt-${a.symbol}`);
        if (el) el.value = 0;
    });
    updateFormula();
    document.getElementById('results').innerHTML = '';
    allCids = [];
}

async function pubchemFetch(url) {
    // PubChem may return 202 + ListKey for async searches — poll until done
    for (let attempt = 0; attempt < 12; attempt++) {
        const resp = await fetch(url);
        const text = await resp.text();
        let data;
        try { data = JSON.parse(text); } catch { throw new Error('Neplatná odpověď ze serveru'); }

        if (data.Fault) {
            throw new Error((data.Fault.Details && data.Fault.Details[0]) || data.Fault.Message || 'Sloučenina nenalezena');
        }

        if (data.Waiting && data.Waiting.ListKey) {
            // async result — poll via listkey
            url = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/listkey/${data.Waiting.ListKey}/JSON?MaxRecords=30`;
            await new Promise(r => setTimeout(r, 1500));
            continue;
        }

        return data;
    }
    throw new Error('Server neodpověděl včas, zkus to znovu');
}

async function search() {
    const parts = hillFormula();
    if (parts.length === 0) return;
    const formula = formulaString(parts);

    const btn = document.getElementById('searchBtn');
    btn.disabled = true;
    const results = document.getElementById('results');
    results.innerHTML = `<div class="status loading">Hledám strukturu vzorce ${formula}…</div>`;
    allCids = [];

    try {
        const url = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/formula/${encodeURIComponent(formula)}/JSON?MaxRecords=5`;
        const data = await pubchemFetch(url);

        if (!data.PC_Compounds || data.PC_Compounds.length === 0) {
            throw new Error('Žádná sloučenina nebyla nalezena');
        }

        // Prefer neutral compounds (charge === 0) over ions
        const sorted = [...data.PC_Compounds].sort((a, b) => {
            const ca = Math.abs(a.charge || 0);
            const cb = Math.abs(b.charge || 0);
            if (ca !== cb) return ca - cb;
            return a.id.id.cid - b.id.id.cid;
        });
        const cid = sorted[0].id.id.cid;
        results.innerHTML = `<div class="status loading">Načítám detaily…</div>`;
        const detail = await fetchCompound(cid);
        results.innerHTML = '';
        if (detail) results.appendChild(renderCard(detail));

    } catch (e) {
        results.innerHTML = `<div class="status error">⚠ ${e.message}</div>`;
    } finally {
        btn.disabled = false;
    }
}


async function fetchCompound(cid) {
    try {
        const url = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/JSON`;
        const resp = await fetch(url);
        const data = await resp.json();
        const compound = data.PC_Compounds && data.PC_Compounds[0];
        if (!compound) return null;

        const props = {};
        (compound.props || []).forEach(p => {
            const key = p.urn.label + (p.urn.name ? '_' + p.urn.name : '');
            props[key] = p.value.sval || p.value.fval || p.value.ival || '';
        });

        return {
            cid,
            name: props['IUPAC Name_Preferred'] || props['IUPAC Name_Traditional'] || props['IUPAC Name_Systematic'] || `CID ${cid}`,
            iupac: props['IUPAC Name_Systematic'] || '',
            formula: props['Molecular Formula_'] || props['Molecular Formula'] || '',
            weight: props['Molecular Weight_'] || props['Molecular Weight'] || '',
            smiles: props['SMILES_Canonical'] || '',
        };
    } catch { return null; }
}

// ── Konstanty ────────────────────────────────────────────────────────────────

const VALENCE_E = {
    H:1, He:2, Li:1, Be:2, B:3, C:4, N:5, O:6, F:7, Ne:8,
    Na:1, Mg:2, Al:3, Si:4, P:5, S:6, Cl:7, Ar:8,
    K:1, Ca:2, Br:7, I:7, Se:6, Te:6
};

const ATOM_COLOR = {
    H:'#b0b8c8', C:'#c8d3e0', N:'#60a5fa', O:'#f87171', S:'#facc15',
    P:'#fb923c', F:'#34d399', Cl:'#4ade80', Br:'#a78bfa', I:'#c084fc',
    Na:'#fbbf24', K:'#f472b6', Ca:'#e2e8f0', Fe:'#fb923c', Mg:'#86efac', Zn:'#93c5fd'
};

// ── SDF parser ────────────────────────────────────────────────────────────────

function parseSDF(sdf) {
    const lines = sdf.split('\n');
    const counts = lines[3] || '';
    const numAtoms = parseInt(counts.substring(0, 3)) || 0;
    const numBonds = parseInt(counts.substring(3, 6)) || 0;

    const atoms = [];
    for (let i = 0; i < numAtoms; i++) {
        const l = lines[4 + i] || '';
        const x = parseFloat(l.substring(0, 10));
        const y = parseFloat(l.substring(10, 20));
        const element = l.substring(31, 34).trim();
        // SDF charge code: 0=none,1=+3,2=+2,3=+1,4=radical,5=-1,6=-2,7=-3
        const cc = parseInt(l.substring(36, 39)) || 0;
        const charge = [0, 3, 2, 1, 0, -1, -2, -3][cc] || 0;
        atoms.push({ x, y, element, charge });
    }

    const bonds = [];
    for (let i = 0; i < numBonds; i++) {
        const l = lines[4 + numAtoms + i] || '';
        const a1 = parseInt(l.substring(0, 3)) - 1;
        const a2 = parseInt(l.substring(3, 6)) - 1;
        const type = parseInt(l.substring(6, 9)) || 1;
        // type 4=aromatic → treat as 1.5
        bonds.push({ a1, a2, type: type === 4 ? 1.5 : Math.min(type, 3) });
    }

    return { atoms, bonds };
}

// ── Lone pair placement ───────────────────────────────────────────────────────

function lonePairAngles(bondAngles, count) {
    if (count <= 0) return [];
    if (bondAngles.length === 0) {
        return Array.from({length: count}, (_, i) => (i * 2 * Math.PI) / count);
    }
    const sorted = [...bondAngles].sort((a, b) => a - b);
    sorted.push(sorted[0] + 2 * Math.PI);
    const gaps = [];
    for (let i = 0; i < sorted.length - 1; i++) {
        gaps.push({ mid: (sorted[i] + sorted[i+1]) / 2, size: sorted[i+1] - sorted[i] });
    }
    gaps.sort((a, b) => b.size - a.size);
    return gaps.slice(0, count).map(g => g.mid);
}

// ── Canvas renderer ───────────────────────────────────────────────────────────

function seg(ctx, x1, y1, x2, y2) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

function drawBond(ctx, p1, p2, type, shrink1, shrink2, R) {
    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len < 1) return;
    const ux = dx/len, uy = dy/len;
    const px = -uy,   py =  ux;

    const f1 = shrink1 ? R / len : 2 / len;
    const f2 = shrink2 ? R / len : 2 / len;
    const ax = p1.x + ux*len*f1, ay = p1.y + uy*len*f1;
    const bx = p2.x - ux*len*f2, by = p2.y - uy*len*f2;

    ctx.strokeStyle = '#c8d3e0';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';

    if (type === 1) {
        seg(ctx, ax, ay, bx, by);
    } else if (type === 2) {
        const off = 3.5;
        seg(ctx, ax+px*off, ay+py*off, bx+px*off, by+py*off);
        seg(ctx, ax-px*off, ay-py*off, bx-px*off, by-py*off);
    } else if (type === 3) {
        const off = 4.5;
        seg(ctx, ax, ay, bx, by);
        seg(ctx, ax+px*off, ay+py*off, bx+px*off, by+py*off);
        seg(ctx, ax-px*off, ay-py*off, bx-px*off, by-py*off);
    } else {
        // 1.5 aromatic — single line (simplified)
        seg(ctx, ax, ay, bx, by);
    }
}

function renderMolecule(mol, canvas) {
    const W = canvas.width, H = canvas.height;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#12141e';
    ctx.fillRect(0, 0, W, H);

    if (!mol.atoms.length) return;

    const PAD = 55;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    mol.atoms.forEach(a => {
        if (a.x < minX) minX = a.x; if (a.x > maxX) maxX = a.x;
        if (a.y < minY) minY = a.y; if (a.y > maxY) maxY = a.y;
    });

    const rW = maxX - minX || 1, rH = maxY - minY || 1;
    const scale = Math.min((W - 2*PAD) / rW, (H - 2*PAD) / rH);
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;

    // SDF Y is up, canvas Y is down → flip Y
    const toC = (x, y) => ({ x: W/2 + (x - cx)*scale, y: H/2 - (y - cy)*scale });

    const LABEL_R = 14; // px radius cleared around labeled atoms
    const hasLabel = el => el !== 'C';

    // ── Draw bonds
    mol.bonds.forEach(b => {
        const pa = toC(mol.atoms[b.a1].x, mol.atoms[b.a1].y);
        const pb = toC(mol.atoms[b.a2].x, mol.atoms[b.a2].y);
        drawBond(ctx, pa, pb, b.type,
            hasLabel(mol.atoms[b.a1].element),
            hasLabel(mol.atoms[b.a2].element),
            LABEL_R);
    });

    // ── Draw atom labels + lone pairs
    mol.atoms.forEach((atom, i) => {
        const p = toC(atom.x, atom.y);

        if (hasLabel(atom.element)) {
            ctx.fillStyle = '#12141e';
            ctx.beginPath();
            ctx.arc(p.x, p.y, LABEL_R, 0, 2*Math.PI);
            ctx.fill();

            ctx.fillStyle = ATOM_COLOR[atom.element] || '#e0e0e0';
            ctx.font = `bold ${atom.element.length > 1 ? 13 : 15}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(atom.element, p.x, p.y);
        }

        // Lone pairs
        const valence = VALENCE_E[atom.element];
        if (!valence) return;

        const atomBonds = mol.bonds.filter(b => b.a1 === i || b.a2 === i);
        let bondSum = 0;
        const angles = [];
        atomBonds.forEach(b => {
            bondSum += b.type;
            const oi = b.a1 === i ? b.a2 : b.a1;
            const op = toC(mol.atoms[oi].x, mol.atoms[oi].y);
            angles.push(Math.atan2(op.y - p.y, op.x - p.x));
        });

        const effectiveValence = valence - atom.charge;
        const lpCount = Math.max(0, Math.round((effectiveValence - bondSum) / 2));
        if (lpCount === 0) return;

        const lpA = lonePairAngles(angles, lpCount);
        const dist = LABEL_R + 9;
        ctx.fillStyle = '#7dd3fc';

        lpA.forEach(angle => {
            const lx = p.x + Math.cos(angle) * dist;
            const ly = p.y + Math.sin(angle) * dist;
            const perp = angle + Math.PI / 2;
            const pd = 3.5;
            for (const s of [-1, 1]) {
                ctx.beginPath();
                ctx.arc(lx + Math.cos(perp)*pd*s, ly + Math.sin(perp)*pd*s, 2.5, 0, 2*Math.PI);
                ctx.fill();
            }
        });
    });
}

// ── Card rendering ────────────────────────────────────────────────────────────

function renderCard(d) {
    const fmtFormula = f => f.replace(/([A-Z][a-z]?)(\d+)/g, '$1<sub>$2</sub>');

    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = `
        <div class="result-image-wrap">
            <canvas></canvas>
        </div>
        <div class="result-info">
            <div class="result-name">${escHtml(d.name)}</div>
            ${d.iupac && d.iupac !== d.name ? `<div class="result-iupac">${escHtml(d.iupac)}</div>` : ''}
            ${d.formula ? `<div class="result-formula">${fmtFormula(d.formula)}</div>` : ''}
            <div class="badges">
                ${d.weight ? `<span class="badge">M<sub>r</sub>: <span>${parseFloat(d.weight).toFixed(2)}</span></span>` : ''}
                ${d.smiles ? `<span class="badge">SMILES: <span style="font-family:monospace">${escHtml(d.smiles.length > 50 ? d.smiles.slice(0,50)+'…' : d.smiles)}</span></span>` : ''}
            </div>
            <a class="link-pubchem" href="https://pubchem.ncbi.nlm.nih.gov/compound/${d.cid}" target="_blank">
                Zobrazit na PubChem →
            </a>
        </div>
    `;

    const canvas = card.querySelector('canvas');
    canvas.width = 500;
    canvas.height = 500;

    // Fetch SDF (has precise 2D coordinates) and draw
    fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${d.cid}/SDF?record_type=2d`)
        .then(r => r.text())
        .then(sdf => renderMolecule(parseSDF(sdf), canvas))
        .catch(() => {
            // Fallback: PubChem PNG
            const img = new Image();
            img.src = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${d.cid}/PNG?record_type=2d&image_size=500x500`;
            img.style.cssText = 'width:100%;height:100%;object-fit:contain';
            canvas.parentElement.appendChild(img);
        });

    return card;
}

function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

buildGrid();
</script>
</body>
</html>
